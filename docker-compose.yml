version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: juwanna-fantasy-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: juwanna_fantasy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./api
      dockerfile: Dockerfile.migrate
    container_name: juwanna-fantasy-migrate
    environment:
      - PGMGR_HOST=postgres
      - PGMGR_PORT=5432
      - PGMGR_USERNAME=postgres
      - PGMGR_PASSWORD=postgres
      - PGMGR_DATABASE=juwanna_fantasy
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: juwanna-fantasy-api
    ports:
      - "8080:8080"
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=juwanna_fantasy
      - SERVER_PORT=8080
      - SLEEPER_LEAGUE_ID=${SLEEPER_LEAGUE_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: juwanna-fantasy-web
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
